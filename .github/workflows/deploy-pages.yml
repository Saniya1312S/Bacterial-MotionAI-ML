name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "results/**"
      - "images/**"
      - "scripts/export_dashboard_data.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain how to enable Pages (only runs if the step above failed)
        if: steps.cfg.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled yet::Open Settings > Pages > Build and deployment > Source and choose 'GitHub Actions'. Then open the Actions tab, select this workflow and click 'Re-run all jobs' (or 'Run workflow')."
          exit 1

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
